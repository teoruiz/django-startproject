name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, compose]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: extractions/setup-just@v3
      - name: Validate template or generated application
        env:
          DATABASE: ${{ matrix.database }}
        run: |
          if [ ! -f manage.py ]; then
            just template-test "$DATABASE"
          elif [ "$DATABASE" = compose ]; then
            just bootstrap
            just up -d --wait
            just manage check
            just manage makemigrations --check --dry-run
            just check
          else
            export DATABASE_URL=sqlite:///ci.sqlite3 DJANGO_DEBUG=true
            uv sync --locked
            uv run --locked python manage.py check
            uv run --locked python manage.py migrate --noinput
            uv run --locked pytest
            pnpm --dir frontend install --frozen-lockfile
            just lint typecheck api-check frontend-build
          fi
      - name: Container logs
        if: failure()
        run: docker compose logs || true
      - name: Stop generated application
        if: always()
        run: test ! -f manage.py || docker compose down --volumes

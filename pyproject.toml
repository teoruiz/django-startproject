[project]
name = "django-product"
version = "0.1.0"
description = "Django application backend"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1,<6.2",
    "django-allauth[headless,headless-spec]>=65.19.4,<66",
    "django-ninja>=1.4,<2",
    "django-unfold>=0.70,<1",
    "django-storages>=1.14,<2",
    "django-extensions>=4,<5",
    "environs[django]>=14,<15",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "whitenoise>=6.9,<7",
    "gunicorn>=23,<26",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "model-bakery>=1.20,<2",
    "ruff>=0.14,<1",
    "basedpyright>=1.31,<2",
    "pre-commit>=4,<5",
    "django-stubs>=6.0,<7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["core/tests"]

[tool.basedpyright]
include = ["config", "core", "conftest.py"]
exclude = ["**/migrations", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations", "frontend", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
